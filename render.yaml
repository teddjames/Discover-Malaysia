# Discover Malaysia — Render Blueprint
services:
  - type: web
    name: discover-malaysia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python database/seed_db.py && gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
